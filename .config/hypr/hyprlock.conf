# ╔══════════════════════════════════════════════════════════════╗
# ║                    HYPRLOCK CONFIG                          ║
# ║            Gruvbox Dark · Monocraft · Clean                 ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Paleta Gruvbox Dark:
#   bg0    #282828   bg1  #3c3836   bg2  #504945
#   fg     #ebdbb2   fg2  #d5c4a1
#   red    #cc241d   green #98971a  yellow #d79921
#   blue   #458588   purple #b16286  aqua  #689d6a
#   orange #d65d0e   gray  #928374

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
    text_trim = true
}

# ══════════════════════════════════════════════════════════════
# BACKGROUND — Screenshot com blur
# ══════════════════════════════════════════════════════════════
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ══════════════════════════════════════════════════════════════
# RELÓGIO — Hora grande no topo
# ══════════════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(235, 219, 178, 0.95)   # fg #ebdbb2
    font_size = 80
    font_family = Monocraft
    position = 0, -80
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Data abaixo do relógio
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B de %Y")"
    color = rgba(213, 196, 161, 0.75)   # fg2 #d5c4a1
    font_size = 16
    font_family = Monocraft
    position = 0, -175
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ══════════════════════════════════════════════════════════════
# AVATAR — Foto de perfil
# ══════════════════════════════════════════════════════════════
image {
    monitor =
    path = /home/carlos/wallpapers/macaco.jpg
    size = 96
    rounding = -1
    border_size = 3
    border_color = rgba(152, 151, 26, 0.8)   # green #98971a
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.2
}

# Nome do usuário
label {
    monitor =
    text = carlos
    color = rgba(235, 219, 178, 0.80)   # fg #ebdbb2
    font_size = 15
    font_family = Monocraft
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ══════════════════════════════════════════════════════════════
# INPUT FIELD — Campo de senha
# ══════════════════════════════════════════════════════════════
input-field {
    monitor =
    size = 270, 50
    position = 0, -90
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(152, 151, 26, 0.7)    # green #98971a
    inner_color = rgba(40, 40, 40, 0.55)     # bg0 #282828
    font_color = rgba(235, 219, 178, 0.95)   # fg #ebdbb2
    font_family = Monocraft

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##928374" font_size="13px">senha</span>

    rounding = 8

    check_color = rgba(152, 151, 26, 0.9)    # green
    fail_color = rgba(204, 36, 29, 0.9)      # red #cc241d
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 300

    capslock_color = rgba(215, 153, 33, 0.9) # yellow #d79921

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}