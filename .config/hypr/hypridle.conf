# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                        HYPRIDLE CONFIG                                   ║
# ║         Spotify · Emby · Dim · DPMS · Lock · Suspend                     ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Inibições ativas:
#   — Spotify tocando  → inibe lock, DPMS e suspend
#   — Emby com sessão  → inibe APENAS o suspend
#
# Dependências:
#   playerctl   →  pacman -S playerctl
#   brightnessctl → pacman -S brightnessctl
#   curl + jq   →  pacman -S curl jq

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DIMMER — Escurece a tela aos 4min como aviso visual
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
listener {
    timeout    = 240
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LOCK — 5min, inibido se Spotify estiver tocando
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
listener {
    timeout    = 300
    on-timeout = playerctl -p spotify status 2>/dev/null | grep -q "^Playing$" || loginctl lock-session
    on-resume  = brightnessctl -r
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DPMS OFF — Desliga monitor aos 10min, inibido se Spotify tocando
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
listener {
    timeout    = 600
    on-timeout = playerctl -p spotify status 2>/dev/null | grep -q "^Playing$" || hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SUSPEND — 30min
# Inibido se:  Spotify tocando  OU  Emby com sessão ativa
#
# Lógica do comando:
#   1. checa Spotify → se Playing, para aqui (não suspende)
#   2. consulta API Emby → conta sessões com NowPlayingItem
#   3. se count > 0 (alguém assistindo), para aqui (não suspende)
#   4. se ambos negativos → suspende
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
listener {
    timeout    = 1800
    on-timeout = playerctl -p spotify status 2>/dev/null | grep -q "^Playing$" || [ "$(curl -sf "http://localhost:8096/Sessions?api_key=c35fe2f41de84f3889835232f242fb0d" | jq '[.[] | select(.NowPlayingItem != null)] | length')" -gt 0 ] || systemctl suspend
}